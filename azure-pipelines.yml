
trigger:
  - main

pool:
  vmImage: 'windows-latest'

steps:

  # Step 1: Checkout GitHub repository
  - checkout: self

  # Step 2: Execute Selenium TestNG tests
  - task: Maven@4
    displayName: 'Execute Selenium Automation Tests'
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'clean test -Dheadless=true'

      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '1.21'
      jdkArchitectureOption: 'x64'

      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      testRunTitle: 'Tutorials Ninja Automation Results'

  # Step 3: Publish Allure Report
  - task: PublishAllureReport@2
    displayName: 'Publish Allure Report'
    condition: always()
    inputs:
      testResultsDir: 'target/allure-results'
      reportName: 'Tutorials Ninja Automation Report'
      allureVersion: '2.36.0'